<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Заполните форму регистрации.">
    <title>Регистрация</title>
    <link rel="stylesheet" href="CSS.css">
</head>
<body>
    <main class="page">
        <section class="registration" aria-labelledby="page-title">
            <h1 id="page-title">Регистрация</h1>
            <p class="intro">Введите свои данные, чтобы зарегистрироваться.</p>

            <form class="registration-form" id="registration-form">
                <div class="form-field">
                    <label for="name">Имя</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="given-name"
                        placeholder="Например, Фаррух"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="phone">Телефон</label>
                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        autocomplete="tel"
                        placeholder="+992900123456"
                        pattern="\+[1-9][0-9]{7,14}"
                        required
                    >
                    <small class="field-help">Укажите полный номер с кодом страны, например +992900123456.</small>
                </div>

                <div class="form-field">
                    <label for="country">Страна</label>
                    <select id="country" name="country" required>
                        <option value="" disabled selected>Выберите страну</option>
                        <option value="china">Китай</option>
                        <option value="usa">США</option>
                        <option value="tajikistan">Таджикистан</option>
                        <option value="india">Индия</option>
                    </select>
                </div>

                <button type="submit">Зарегистрироваться</button>
                <p class="message" id="registration-message" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
